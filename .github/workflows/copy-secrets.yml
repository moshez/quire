name: Copy signing secrets to bats-lang/quire

on:
  push:
    paths:
      - ".github/workflows/copy-secrets.yml"

permissions: {}

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Sanity check
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is empty"
              exit 1
            fi
            echo "$name is set"
          done
          ks="$RUNNER_TEMP/keystore.jks"
          trap 'rm -f "$ks"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$ks"
          keytool -list -keystore "$ks" -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" > /dev/null
          echo "Store password and alias OK"
          keytool -certreq -keystore "$ks" -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" -keypass:env KEY_PASSWORD -file /dev/null
          echo "Key password OK"

      - name: Copy
        env:
          GH_TOKEN: ${{ secrets.TARGET_REPO_TOKEN }}
          TARGET: bats-lang/quire
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          start="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "COPY_START=$start" >> "$GITHUB_ENV"
          echo "Start time: $start"
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            printf '%s' "${!name}" | gh secret set "$name" --repo "$TARGET"
            echo "Set $name"
          done

      - name: Verify
        env:
          GH_TOKEN: ${{ secrets.TARGET_REPO_TOKEN }}
        run: |
          set -euo pipefail
          gh secret list --repo bats-lang/quire --json name,updatedAt > "$RUNNER_TEMP/secrets.json"
          jq -r '.[] | "\(.name) \(.updatedAt)"' "$RUNNER_TEMP/secrets.json"
          jq -e --arg start "$COPY_START" '
            def ts: sub("\\.[0-9]+"; "") | fromdateiso8601;
            ["KEYSTORE_BASE64", "KEYSTORE_PASSWORD", "KEY_ALIAS", "KEY_PASSWORD"] as $want
            | . as $list
            | [ $want[] as $n
                | ($list | map(select(.name == $n)) | first) as $s
                | if $s == null then "MISSING \($n)\n"
                  elif ($s.updatedAt | ts) < ($start | ts) then "STALE \($n) \($s.updatedAt) < \($start)\n"
                  else empty end ]
            | if length == 0 then true else (.[] | stderr) | false end
          ' "$RUNNER_TEMP/secrets.json" > /dev/null || { echo "::error::Verification failed (see above)"; exit 1; }
          echo "All four secrets present and updated since $COPY_START"
